[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mle-02-p2-team2"
version = "0.1.0"
description = "의료관련감염병 관리지침 지식그래프"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.19",
    "neo4j>=6.4.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "jupyterlab>=4,<5",
    "pytest>=9.2.0",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
