# 화면 테마(11/09 시안 C). 이 파일을 지우면 Streamlit 기본 테마로 돌아간다.
# 로컬: 프로젝트 루트에서 `streamlit run src/rag/ui/app.py` 로 실행할 때 읽힌다. 클라우드: 저장소 루트의 이 파일을 읽는다.
